    spring.application.name=account-service
    server.port = 8081

    spring.datasource.url=jdbc:mariadb://localhost:3307/account_db?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=your_password

    spring.datasource.hikari.connection-timeout=30000
    spring.datasource.hikari.initialization-fail-timeout=60000

    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

    # Kafka consumer configuration
    spring.kafka.bootstrap-servers=localhost:9092
    spring.kafka.consumer.group-id=account-service-group
    spring.kafka.consumer.auto-offset-reset=earliest
    # JSON Deserializer
    spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

    # JSON
    spring.kafka.consumer.properties.spring.json.trusted.packages=*
    spring.kafka.consumer.properties.spring.json.use.type.headers=false
    spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

    # Producer

    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health,info

  