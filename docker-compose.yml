services:

  redis:
    image: redis:latest
    container_name: banking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - banking-network

  mariadb:
    image: mariadb:latest
    container_name: banking-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: your_password
    ports:
      - "3307:3306"
    volumes:
      - banking-mariadb-data:/var/lib/mysql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: banking-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: banking-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: banking-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - banking-network

  account-service:
    build: ./account-service
    ports:
      - "8080:8081"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    ports:
      - "8082:8082"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network

  fraud-detection-service:
    build: ./fraud-detection-service
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8086"
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - banking-network

  payment-service:
    build: ./payment-service
    ports:
      - "8085:8084"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network

  api-gateway:
    build: ./api-gateway
    ports:
      - "8088:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      fraud-detection-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - banking-network

volumes:

  banking-mariadb-data:

networks:

  banking-network:
    driver: bridge
